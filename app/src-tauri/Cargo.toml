[package]
name = "ash"
version = "0.1.0"
description = "Ash — a seal that destroys the data if you open it"
authors = ["Lakshaya Sharma", "Ananya"]
edition = "2021"
rust-version = "1.77"

[lib]
name = "ash_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[features]
# tauri build enables this; it makes the release binary serve the embedded bundle
# instead of navigating to devUrl.
custom-protocol = ["tauri/custom-protocol"]

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
libc = "0.2"
tiny_http = "0.12"
ureq = { version = "2.12", features = ["json", "tls"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
