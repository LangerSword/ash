[package]
name = "ash"
version = "0.1.0"
description = "Ash — a seal that destroys the data if you open it"
authors = ["Lakshaya Sharma", "Ananya"]
edition = "2021"
rust-version = "1.77"

[lib]
name = "ash_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = { version = "2.12", default-features = false, features = ["json"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
